name: Build and Release Debian Packages

on:
  push:
    branches:
      - rk/mesaaco
  workflow_dispatch:

jobs:

  build_and_release:
    name: Build and Release Debian Packages
    runs-on: ubuntu-24.04-arm
    # Build against resolute, like the mesaaco PPA's own build.
    container: ubuntu:26.04
    # A full Mesa with every arm64 driver takes a while on a 4-core runner.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:

      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot dpkg-dev git ca-certificates curl meson
          # The snapshot needs a newer libdrm (and the PPA builds against its wayland) than resolute has:
          # take the build dependencies from the mesaaco PPA too. The packages run with resolute's.
          mkdir -p /etc/apt/keyrings
          curl -fsSL --retry 3 -o /etc/apt/keyrings/mesaaco.asc \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0xF7D9F0EAA92354B674013D4523A159D3E514D90F'
          printf '%s\n' 'Types: deb' 'URIs: https://ppa.launchpadcontent.net/ernstp/mesaaco/ubuntu/' 'Suites: resolute' \
            'Components: main' 'Signed-By: /etc/apt/keyrings/mesaaco.asc' > /etc/apt/sources.list.d/mesaaco.sources
          apt-get update

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ci/build-deb.sh "$RUNNER_TEMP/mesa-deb" --install-deps
          cp -a "$RUNNER_TEMP"/mesa-deb/*.deb ./

      - name: Get version
        id: get_version
        run: |
          ver="$(dpkg-deb -f "$(ls libgl1-mesa-dri_*.deb)" Version)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # git tags cannot contain ':', '+' or '~': sanitise them.
          echo "tag=$(echo "$ver" | tr ':+~' '---')" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: get_commit_hash
        uses: prompt/actions-commit-hash@v3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          tag_name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          # Tag the commit that was built: a new tag otherwise goes on the default branch (cix).
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ./*.deb
