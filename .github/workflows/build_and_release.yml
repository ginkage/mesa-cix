name: Build and Release Debian Packages

on:
  push:
    branches:
      - cix
  workflow_dispatch:

jobs:

  build_and_release:
    name: Build and Release Debian Packages
    runs-on: ubuntu-24.04-arm
    # Build against resolute and Armbian's libdrm/mesa-libclc, like Armbian's own Mesa build.
    container: ubuntu:26.04
    # A full Mesa with every arm64 driver takes a while on a 4-core runner.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:

      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot dpkg-dev git ca-certificates curl patch meson

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Armbian beta (libdrm, Mesa, mesa-libclc only)
        # The keyring is a copy of the Armbian image's /usr/share/keyrings/armbian-archive-keyring.gpg:
        # 8CFA83D13EB2181EEF5843E41EB30FAF236099FE, A0C85D1FCDADEB8F185B06FC782A20B506F01811.
        run: |
          install -m644 ci/armbian-archive-keyring.gpg /usr/share/keyrings/armbian-archive-keyring.gpg
          install -m644 ci/armbian-beta.sources /etc/apt/sources.list.d/armbian-beta.sources
          install -m644 ci/armbian-beta.pref /etc/apt/preferences.d/armbian-beta.pref
          apt-get update

      - name: Build Debian packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ci/build-deb.sh "$RUNNER_TEMP/mesa-deb" --install-deps
          cp -a "$RUNNER_TEMP"/mesa-deb/*.deb ./

      - name: Get version
        id: get_version
        run: |
          ver="$(dpkg-deb -f "$(ls libgl1-mesa-dri_*.deb)" Version)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # git tags cannot contain ':', '+' or '~': sanitise them.
          echo "tag=$(echo "$ver" | tr ':+~' '---')" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: get_commit_hash
        uses: prompt/actions-commit-hash@v3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          tag_name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          generate_release_notes: true
          files: |
            ./*.deb
